name: Build Core

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to release (e.g. v26.10.31-allowinsecure). Leave empty to build only."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Get project dependencies
        run: go mod download

      - name: Build core
        shell: bash
        run: |
          mkdir -p build_assets
          COMMID=$(git describe --always --dirty)
          OUTPUT="build_assets/xray-${GOOS}-${GOARCH}"
          if [[ "${GOOS}" == "windows" ]]; then
            OUTPUT="${OUTPUT}.exe"
          fi
          go build -o "${OUTPUT}" -trimpath -buildvcs=false -gcflags="all=-l=4" \
            -ldflags="-X github.com/xtls/xray-core/core.build=${COMMID} -s -w -buildid=" \
            -v ./main
          echo "- \`${OUTPUT}\` (${GOOS}/${GOARCH}, commit ${COMMID})" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload core binary
        uses: actions/upload-artifact@v7
        with:
          name: xray-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build_assets/
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release_assets
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          cd release_assets
          sha256sum xray-* > SHA256SUMS
          ls -lh
          cd ..
          cat > RELEASE_NOTES.md <<EOF
          Fork build of Xray-core from [$GITHUB_REPOSITORY](https://github.com/$GITHUB_REPOSITORY) at commit $GITHUB_SHA.

          This build restores the removed allowInsecure TLS option.

          Built by GitHub Actions run [$GITHUB_RUN_ID](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID).

          Assets:
          - xray-linux-amd64
          - xray-linux-arm64
          - xray-darwin-arm64
          - xray-windows-amd64.exe
          - SHA256SUMS
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release_assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            TARGET=()
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
              TARGET=(--target "$GITHUB_SHA")
            fi
            gh release create "$TAG" "${TARGET[@]}" --repo "$GITHUB_REPOSITORY" \
              --title "Xray Core $TAG" --notes-file RELEASE_NOTES.md release_assets/*
          fi
