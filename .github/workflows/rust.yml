name: Rust migration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # The Go reference implementation has been removed from the tree; the
  # interop evidence lives in the git history (check out any commit before
  # the removal and build target/reference-xray from ./main) and in
  # notes/PARITY_AUDIT.md. Without a reference executable the interop
  # targets self-skip and provide no interoperability proof, so no job
  # runs them here.
